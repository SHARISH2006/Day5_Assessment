<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-100 px-4 py-8 text-slate-800">
    <main class="w-full max-w-md rounded-2xl bg-white p-6 shadow-xl sm:p-10">
        <p class="text-sm font-semibold uppercase tracking-widest text-indigo-600">Student portal</p>
        <h1 class="mt-2 text-3xl font-bold text-slate-900">Log in</h1>
        <p class="mt-3 text-slate-600">Use your registered email and password.</p>

        {% if message %}
        <div class="mt-6 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"
             role="alert">{{ message }}</div>
        {% endif %}

        <form class="mt-6 space-y-5" action="{{ url_for('login') }}" method="post">
            <div>
                <label for="email" class="mb-2 block text-sm font-semibold text-slate-700">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required
                       class="w-full rounded-lg border border-slate-300 px-3 py-3 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100">
            </div>
            <div>
                <label for="password" class="mb-2 block text-sm font-semibold text-slate-700">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required
                       class="w-full rounded-lg border border-slate-300 px-3 py-3 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100">
            </div>
            <button type="submit"
                    class="w-full rounded-lg bg-indigo-600 px-5 py-3 font-semibold text-white transition hover:bg-indigo-700">
                Log in
            </button>
        </form>
        <a href="{{ url_for('home') }}" class="mt-6 block text-center text-sm font-semibold text-indigo-600 hover:text-indigo-800">
            Register a new student
        </a>
    </main>
</body>
</html>
