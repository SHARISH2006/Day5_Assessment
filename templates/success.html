<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registration Successful</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-100 px-4 text-slate-800">
    <main class="w-full max-w-lg rounded-2xl bg-white p-8 text-center shadow-xl sm:p-12">
        <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-emerald-100 text-3xl text-emerald-600">
            ✓
        </div>
        <h1 class="mt-6 text-3xl font-bold text-slate-900">Registration successful</h1>
        <p class="mt-4 text-lg text-slate-600">
            Welcome, {{ name }}! You have successfully registered.
        </p>
        <a href="{{ url_for('home') }}"
           class="mt-8 inline-block rounded-lg bg-indigo-600 px-5 py-3 font-semibold text-white transition hover:bg-indigo-700">
            Register another student
        </a>
    </main>
</body>
</html>
